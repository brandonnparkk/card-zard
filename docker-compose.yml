services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: card_zard
      POSTGRES_PASSWORD: card_zard
      POSTGRES_DB: card_zard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is empty (first start).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card_zard -d card_zard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
